# SPA hosting for the SPACZ Admin Console. ${API_ORIGIN} is substituted by the nginx image at start
# (envsubst on /etc/nginx/templates). Set it to the gateway origin, e.g. https://api.spacz.in
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # connect-src must include the gateway; frame-src allows the OpenStreetMap embed on hall pages.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ${API_ORIGIN}; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  # Fingerprinted assets: cache for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA fallback; never cache the shell so new releases are picked up.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
